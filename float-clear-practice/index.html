<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục bằng Float</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-column">
        <h2>Cột bên trái</h2>
        <p>Cột nội dung chính chiếm 60% chiều rộng.</p>
        <p>Sử dụng float: left để căn cột sang trái.</p>
      </div>

      <div class="right-column">
        <h2>Cột bên phải</h2>
        <p>Sidebar chiếm 38% chiều rộng.</p>
        <p>Sử dụng float: right để căn cột sang phải.</p>
      </div>

      <div class="clear"></div>
    </div>
  </body>
</html>
